name: indian_space_tracker
description: Cross-platform tracker for Indian space missions, launch vehicles, ISRO centres, and space startups.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  fl_chart: ^0.69.0
  intl: '>=0.19.0 <0.21.0'
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true